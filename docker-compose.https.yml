services:
  backend:
    environment:
      ALLOWED_HOSTS: zqxiaochengxv.xin,www.zqxiaochengxv.xin,47.236.89.16,frontend,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://zqxiaochengxv.xin,https://www.zqxiaochengxv.xin
      ONLYOFFICE_DOCUMENT_SERVER: https://zqxiaochengxv.xin/onlyoffice
  frontend:
    ports: !reset []
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
