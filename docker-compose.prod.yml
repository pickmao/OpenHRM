services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: 干部动态调整系统.settings_production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DASHSCOPE_API_KEY: ${QWEN_KEY:-}
      ALLOWED_HOSTS: ${PUBLIC_HOST},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://${PUBLIC_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ONLYOFFICE_DOCUMENT_SERVER: http://${PUBLIC_HOST}/onlyoffice
      ONLYOFFICE_BACKEND_PUBLIC_URL: http://frontend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - media_data:/var/www/media:ro
      - static_data:/var/www/django-static:ro

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "false"
    shm_size: 2gb

volumes:
  postgres_data:
  media_data:
  static_data:
